<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Designed interface artwork: a continuity loop over a production timeline">
  <!-- UI ART ASSET — designed interface art, not production output. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.8" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.70  0 0 0 0 0.82  0 0 0 0.06 0"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#orb)"/>
  <rect width="640" height="360" fill="url(#orb2)"/>
  <!-- continuity loop -->
  <g fill="none" stroke-linecap="round">
    <path d="M180 168 A 92 92 0 1 1 236 250" stroke="#c9bfff" stroke-width="3.4" opacity="0.95"/>
    <path d="M180 168 A 92 92 0 0 1 214 118" stroke="#e8f0ff" stroke-width="4.6" opacity="0.25" filter="url(#soft)"/>
    <path d="M226 250 h22 l-11 20 Z" fill="#c9bfff" stroke="none"/>
    <path d="M170 158 h22 l-11 -20 Z" fill="#c9bfff" stroke="none" opacity="0.9"/>
  </g>
  <circle cx="180" cy="168" r="0" fill="none"/>
  <!-- play core -->
  <circle cx="180" cy="168" r="34" fill="#16202f" stroke="#5d7cb3" stroke-width="2"/>
  <path d="M170 152 l28 16 -28 16 Z" fill="#cfe0ff"/>
  <circle cx="180" cy="168" r="48" fill="#8b7cff" opacity="0.14" filter="url(#soft)"/>
  <!-- timeline with resumable checkpoint -->
  <g>
    <path d="M320 268 H560" stroke="#2c3b57" stroke-width="3" stroke-linecap="round"/>
    <path d="M320 268 H452" stroke="#6ba0ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="320" cy="268" r="6" fill="#16202f" stroke="#34d399" stroke-width="2"/>
    <circle cx="386" cy="268" r="6" fill="#16202f" stroke="#34d399" stroke-width="2"/>
    <circle cx="452" cy="268" r="9" fill="#16202f" stroke="#fbbf24" stroke-width="2.4"/>
    <circle cx="452" cy="268" r="16" fill="#fbbf24" opacity="0.16" filter="url(#soft)"/>
    <circle cx="518" cy="268" r="6" fill="#16202f" stroke="#3a4c6e" stroke-width="2"/>
    <path d="M452 250 v-14" stroke="#3a4c6e" stroke-width="1.6" stroke-dasharray="3 4"/>
    <rect x="424" y="222" width="56" height="14" rx="7" fill="#16202f" stroke="#41557a" stroke-width="1.4"/>
    <rect x="430" y="227" width="30" height="4" rx="2" fill="#9cc2ff" opacity="0.8"/>
  </g>
  <!-- resume glyph -->
  <g stroke="#9cc2ff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M540 120 a 30 30 0 1 1 -9 -21"/>
    <path d="M541 88 v 16 h -16"/>
  </g>
  <path d="M526 112 v 18 l 15 -9 Z" fill="#cfe0ff"/>
  <rect width="640" height="360" filter="url(#grain)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
</svg>
