<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Designed interface artwork: an uplink signal to platforms">
  <!-- UI ART ASSET — designed interface art, not production output. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161009"/>
      <stop offset="1" stop-color="#191208"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#eda43c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#eda43c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.2" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#d8862f" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d8862f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.88  0 0 0 0 0.72  0 0 0 0 0.52  0 0 0 0.06 0"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#orb)"/>
  <rect width="640" height="360" fill="url(#orb2)"/>
  <!-- broadcast arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M250 250 A 95 95 0 0 1 390 250" stroke="#f7b955" stroke-width="3" opacity="0.9"/>
    <path d="M215 250 A 135 135 0 0 1 425 250" stroke="#d8862f" stroke-width="2.6" opacity="0.65"/>
    <path d="M180 250 A 175 175 0 0 1 460 250" stroke="#eda43c" stroke-width="2.2" opacity="0.4"/>
    <path d="M145 250 A 215 215 0 0 1 495 250" stroke="#eda43c" stroke-width="1.8" opacity="0.22"/>
  </g>
  <!-- tower -->
  <g stroke="#ffd9a0" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M320 250 V186"/>
    <path d="M302 250 L320 196 L338 250"/>
    <path d="M308 228 H332"/>
  </g>
  <circle cx="320" cy="176" r="9" fill="#241a0d" stroke="#ffe9c4" stroke-width="2.4"/>
  <circle cx="320" cy="176" r="3" fill="#ffe9c4"/>
  <circle cx="320" cy="176" r="20" fill="#ffd9a0" opacity="0.22" filter="url(#soft)"/>
  <!-- platform orbs in the sky -->
  <g>
    <circle cx="180" cy="92" r="15" fill="#241a0d" stroke="#eda43c" stroke-width="2"/>
    <path d="M175.5 85.5 l10 6.5 -10 6.5 Z" fill="#ffd9a0"/>
    <circle cx="470" cy="74" r="15" fill="#241a0d" stroke="#d8862f" stroke-width="2"/>
    <path d="M466 67 v14 l9 -7 Z" fill="#f5d9a6"/>
    <circle cx="330" cy="52" r="11" fill="#241a0d" stroke="#f7b955" stroke-width="1.8" opacity="0.8"/>
  </g>
  <g stroke="#4d3a1e" stroke-width="1.4" opacity="0.7" stroke-dasharray="3 5">
    <path d="M320 168 C 300 130 240 110 196 96"/>
    <path d="M324 166 C 350 120 410 90 456 78"/>
  </g>
  <rect width="640" height="360" filter="url(#grain)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
</svg>
