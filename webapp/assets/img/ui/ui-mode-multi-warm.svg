<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Designed interface artwork: several standalone frames in one production">
  <!-- UI ART ASSET — designed interface art, not production output. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171008"/>
      <stop offset="1" stop-color="#1e1509"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.62" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#d8862f" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d8862f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.3" cy="0.72" r="0.45">
      <stop offset="0" stop-color="#eda43c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#eda43c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d2d16"/>
      <stop offset="1" stop-color="#241a0d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.88  0 0 0 0 0.72  0 0 0 0 0.52  0 0 0 0.06 0"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.85"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.5"/></radialGradient>
  </defs>
  <rect width="480" height="640" fill="url(#bg)"/>
  <rect width="480" height="640" fill="url(#orb)"/>
  <rect width="480" height="640" fill="url(#orb2)"/>
  <!-- three fanned standalone frames -->
  <g>
    <rect x="96" y="238" width="200" height="150" rx="14" fill="url(#frameg)" stroke="#55401f" stroke-width="2" transform="rotate(-9 196 313)" opacity="0.9"/>
    <rect x="140" y="228" width="200" height="150" rx="14" fill="url(#frameg)" stroke="#b98a4a" stroke-width="2" transform="rotate(-2 240 303)"/>
    <rect x="190" y="234" width="200" height="150" rx="14" fill="url(#frameg)" stroke="#d8862f" stroke-width="2" transform="rotate(6 290 309)"/>
    <path d="M282 296 l26 16 -26 16 Z" fill="#fff3dd" transform="rotate(6 290 309)"/>
  </g>
  <!-- one bracket: single production -->
  <g stroke="#ffd9a0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M108 452 v26 h264 v-26"/>
    <path d="M240 478 v34"/>
  </g>
  <circle cx="240" cy="526" r="10" fill="#241a0d" stroke="#ffe9c4" stroke-width="2.2"/>
  <circle cx="240" cy="526" r="3.4" fill="#ffe9c4"/>
  <!-- unit dots -->
  <g>
    <circle cx="176" cy="168" r="6" fill="#241a0d" stroke="#f7b955" stroke-width="1.8"/>
    <circle cx="240" cy="152" r="6" fill="#241a0d" stroke="#d8862f" stroke-width="1.8"/>
    <circle cx="304" cy="168" r="6" fill="#241a0d" stroke="#f7b955" stroke-width="1.8"/>
    <g stroke="#4d3a1e" stroke-width="1.4" stroke-dasharray="3 5">
      <path d="M176 176 L196 232 M240 160 L240 222 M304 176 L292 232"/>
    </g>
  </g>
  <rect width="480" height="640" filter="url(#grain)"/>
  <rect width="480" height="640" fill="url(#vig)"/>
</svg>
